services:
  - type: web
    name: mock-interviewer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
