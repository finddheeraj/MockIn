<!-- Interview Panel -->
<div id="interview-panel">
  <div class="interview-header">
    <div class="interview-meta">
      <span class="meta-chip topic" id="chip-topic">—</span>
      <span class="meta-chip level" id="chip-level">—</span>
      <span class="meta-chip adaptive" id="chip-adaptive" style="display:none;">—</span>
    </div>
    <div class="interview-actions">
      <button class="btn-evaluate" id="btn-evaluate" onclick="endAndEvaluate()">Get Evaluation</button>
      <button class="btn-download" id="btn-download" onclick="downloadTranscript()" style="display:none;">Download PDF</button>
      <button class="btn-reset" onclick="resetInterview()">End Session</button>
    </div>
  </div>

  <!-- Round cards appear here, one per Q&A -->
  <div id="rounds-area">
    <div class="chat-empty" id="chat-empty">
      <div class="chat-empty-icon">Q</div>
      <span>Interview starting…</span>
    </div>
  </div>

  <!-- Active question card (current unanswered question) -->
  <div id="active-question-card" class="active-question-card" style="display:none;">
    <div class="aq-label">
      INTERVIEWER
      <button class="btn-speaker" id="btn-speaker" onclick="toggleNarration()" title="Toggle speaker">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03z"/>
        </svg>
      </button>
    </div>
    <div class="aq-text" id="aq-text"></div>
    <div class="typing-indicator" id="aq-typing" style="display:none;">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="answer-area">
    <div class="answer-label">Your Answer</div>
    <div class="answer-input-wrap">
      <textarea id="answer-input" placeholder="Type or speak your answer… be specific, mention tools, give examples." rows="4" oninput="updateCharCount(this)"></textarea>
      <button class="btn-mic" id="btn-mic" onclick="toggleSpeech()" title="Hold to speak">
        <svg id="mic-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z"/>
        </svg>
        <div class="mic-pulse" id="mic-pulse"></div>
      </button>
    </div>
    <div class="answer-actions">
      <button class="btn-submit" id="btn-submit" onclick="submitAnswer()">
        <span>Submit Answer</span>
        <div class="spinner" id="submit-spinner"></div>
      </button>
      <button class="btn-skip" id="btn-skip" onclick="skipQuestion()">Skip</button>
      <span class="char-count" id="char-count">0 chars</span>
      <span class="speech-status" id="speech-status"></span>
    </div>
  </div>
</div><!-- /interview-panel -->

<!-- Coach Answer Modal -->
<div id="coach-modal-overlay" onclick="if(event.target===this) closeCoachModal()">
  <div class="coach-modal">
    <div class="coach-modal-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="coach-icon">C</div>
        <div>
          <div class="coach-title">Coach's Ideal Answer</div>
          <div class="coach-subtitle">Only you can see this</div>
        </div>
      </div>
      <button onclick="closeCoachModal()" class="modal-close-btn">&times;</button>
    </div>
    <div class="coach-answer-container" id="coach-answer-container">
      <div class="coach-answer-text" id="coach-answer-text"></div>
    </div>
  </div>
</div>
