<!-- Interview Panel -->
<div id="interview-panel">
  <div class="interview-header">
    <div class="interview-meta">
      <span class="meta-chip topic" id="chip-topic">—</span>
      <span class="meta-chip level" id="chip-level">—</span>
      <span class="meta-chip adaptive" id="chip-adaptive" style="display:none;">—</span>
    </div>
    <div class="interview-actions">
      <button class="btn-evaluate" id="btn-evaluate" onclick="endAndEvaluate()">Get Evaluation</button>
      <button class="btn-download" id="btn-download" onclick="downloadTranscript()" style="display:none;">Download PDF</button>
      <button class="btn-reset" onclick="resetInterview()">End Session</button>
    </div>
  </div>

  <div id="chat-area">
    <div class="chat-empty" id="chat-empty">
      <div class="chat-empty-icon">Q</div>
      <span>Interview starting…</span>
    </div>
  </div>

  <div class="right-panels">
    <div id="score-panel" class="score-panel" style="display:none;">
      <div class="score-header">
        <span class="score-title">Performance</span>
        <span class="score-round" id="score-round-label">—</span>
      </div>
      <div class="score-overall" id="score-overall">—</div>
      <div class="score-dimensions" id="score-dimensions"></div>
      <div class="score-rationale" id="score-rationale"></div>
    </div>

    <div id="reference-panel" class="reference-panel" style="display:none;">
      <div class="reference-header">
        <div class="reference-icon">R</div>
        <div>
          <div class="reference-title">Reference Answer</div>
          <div class="reference-subtitle">Ideal response points</div>
        </div>
      </div>
      <div class="reference-content" id="reference-content"></div>
    </div>

    <div id="coach-panel">
      <div class="coach-header">
        <div class="coach-icon">C</div>
        <div>
          <div class="coach-title">Coach</div>
          <div class="coach-subtitle">Only you can see this</div>
        </div>
      </div>
      <div class="coach-empty" id="coach-empty">
        <div class="coach-empty-icon">--</div>
        <span>Watching silently…<br>Feedback after your first answer.</span>
      </div>
      <div class="coach-entries" id="coach-entries" style="display:none;"></div>
    </div>
  </div>

  <div class="answer-area">
    <div class="answer-label">Your Answer</div>
    <div class="answer-input-wrap">
      <textarea id="answer-input" placeholder="Type or speak your answer… be specific, mention tools, give examples." rows="4" oninput="updateCharCount(this)"></textarea>
      <button class="btn-mic" id="btn-mic" onclick="toggleSpeech()" title="Hold to speak">
        <svg id="mic-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z"/></svg>
        <div class="mic-pulse" id="mic-pulse"></div>
      </button>
    </div>
    <div class="answer-actions">
      <button class="btn-submit" id="btn-submit" onclick="submitAnswer()">
        <span>Submit Answer</span>
        <div class="spinner" id="submit-spinner"></div>
      </button>
      <button class="btn-skip" id="btn-skip" onclick="skipQuestion()">Skip</button>
      <span class="char-count" id="char-count">0 chars</span>
      <span class="speech-status" id="speech-status"></span>
    </div>
  </div>
</div><!-- /interview-panel -->

<!-- Coach Answer Modal -->
<div id="coach-modal-overlay" onclick="if(event.target===this) closeCoachModal()" style="position:fixed;inset:0;background:rgba(15,42,94,0.45);z-index:1000;align-items:center;justify-content:center;">
  <div class="coach-modal">
    <div class="coach-modal-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="coach-icon">C</div>
        <div>
          <div class="coach-title">Coach's Ideal Answer</div>
          <div class="coach-subtitle">Only you can see this</div>
        </div>
      </div>
      <button onclick="closeCoachModal()" class="coach-modal-close">&times;</button>
    </div>
    <div class="coach-answer-container" id="coach-answer-container">
      <div class="coach-answer-text" id="coach-answer-text"></div>
    </div>
  </div>
</div>
